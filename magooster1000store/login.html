.inputlogin {

<ul id="navbar">
  <li><a class="navtext" href="index">Home</a></li>

<div class="container">
<input
  type="text"
  class="input inputlogin"
  id="username"
  name="name"
  required
  minlength="0"
  placeholder="Username"
  maxlength="-1" />
</div>
<div class="container">
<input
  type="password"
  class="input inputlogin"
  id="password"
  name="name"
  required
  minlength="0"
  placeholder="Password"
  maxlength="-1" />
</div>
<div class="container">
<button type="button" class="button buttondownload"><b>Login</b></button>
</div>
<p><a  style="color:MediumSlateBlue;" href="signup">Wrong option? Create An account.</a></p>
<script type="module">
	const button = document.querySelector(".buttondownload");
                async function login() {
                const response = await fetch('https://api.trytalo.com/v1/players/auth/login', {
                  method: 'POST',
                  headers: {
                   Authorization: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjIyNjgsImFwaSI6dHJ1ZSwiaWF0IjoxNzg5ODI0ODQ3fQ.xlfl7aFmnSWzcz7joyVnQzBjkFTA9yDpj8Ra_xCWpZI",
                    'Content-Type': 'application/json',
                 },
                  body: JSON.stringify({identifier : document.getElementById("username").value,password : document.getElementById("password").value,withRefresh : true}),
                });

                const data = await response.json();
                //console.log(data);
                if (data.hasOwnProperty("message")){
                 	document.getElementById('error').innerText = data.message.replace("identifier","username").replace("Identifier","Username")
                }
		else {
			if (data.hasOwnProperty("verificationRequired")){
					document.getElementById('error').innerText = "There is a problem with your account"
				}
			if (data.hasOwnProperty("sessionToken")){
        var token = data.sessionToken
		var refresh_token = data.refreshToken
		var alias = data.alias.id
        var player = data.alias.player.id
				
		
		document.location = "https://mag10000.github.io/magooster1000store/checklogin?token=" + token + "&alias=" + alias + "&player=" + player + "&refresh=" + refresh_token
				}
                 		
                		
                	

		}

		}

		if (localStorage) {
			if (localStorage.getItem("storeAccount") == null) {
				console.log("no login data")
			} else {
			console.log(localStorage.getItem("storeAccount"))
			var data = JSON.parse(localStorage.getItem("storeAccount"))
			var alias_id = data.alias
			var player_id = data.player
			var session_token = data.token
			var refresh_token = data.refresh 
			
			const refresh_response = await fetch('https://api.trytalo.com/v1/players/auth/refresh', {
        	method: 'POST',
            headers: {
            		Authorization: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjIyNjgsImFwaSI6dHJ1ZSwiaWF0IjoxNzg5ODI0ODQ3fQ.xlfl7aFmnSWzcz7joyVnQzBjkFTA9yDpj8Ra_xCWpZI",
                	'Content-Type': 'application/json',
					'X-Talo-Player': player_id,
					'X-Talo-Alias': alias_id,
					'X-Talo-Session': session_token,
					
                 },
                  body: JSON.stringify({"refreshToken": refresh_token}),
                });
			console.log(refresh_response)
			const refresh_data = await refresh_response.json();
			refresh_token = refresh_data.refreshToken
			session_token = refresh_data.sessionToken
			localStorage.setItem("storeAccount",JSON.stringify({"token":session_token,"refresh":refresh_token,"alias":alias_id,"player":player_id}))
            const check_response = await fetch('https://api.trytalo.com/v1/players/' + player_id, {
        	method: 'GET',
            headers: {
            		Authorization: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjIyNjgsImFwaSI6dHJ1ZSwiaWF0IjoxNzg5ODI0ODQ3fQ.xlfl7aFmnSWzcz7joyVnQzBjkFTA9yDpj8Ra_xCWpZI",
                	'Content-Type': 'application/json',
					'X-Talo-Player': player_id,
					'X-Talo-Alias': alias_id,
					'X-Talo-Session': session_token,
					
                 },
                  
                });
			const check_data = await check_response.json();
			if (check_data.hasOwnProperty("player")){
				let player_name = check_data.player.aliases.at(0).displayName
				document.getElementById('account_text').innerText = "Logged in as: " + player_name
				document.getElementById("logout").style.display = "block";
				
	} else {
			console.log("Your account will not persist")
	}
	}
	}
		
               
    button.addEventListener("click", login);
</script>

<p id="error" style="color:red;"></p>
