<body id="body">
<ul id="navbar">

<div class="container" id="AppDiv">
	<p class="text">APP</p>
</div>
<div class="container">
	<h1 class="text" id="bigtext">Search</h1>
<script type="module">
	var app_div = document.getElementById("AppDiv");
	app_div.style.display = "none";
	const queryString = window.location.search;
	const urlParams = new URLSearchParams(queryString);
	const is_app = urlParams.get('app')
	console.log("----------")
	console.log(is_app)
	console.log("----------")
  let query = urlParams.get('search')
  document.getElementById('bigtext').innerText = "Search - " + query
  query = query.toLowerCase()
	if (is_app == "true") {
		console.log("its a true")
		app_div.style.display = "block";
		var navbar = document.getElementById("navbar");
		navbar.style.display = "none";
	} else {
  		console.log("its a false")
	}

	const search_response = await fetch('https://api.trytalo.com/v1/game-channels?search=' + query, {
    method: 'GET',
    headers: {
            		Authorization: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjIyNjgsImFwaSI6dHJ1ZSwiaWF0IjoxNzg5ODI0ODQ3fQ.xlfl7aFmnSWzcz7joyVnQzBjkFTA9yDpj8Ra_xCWpZI",
                	'Content-Type': 'application/json',
                 },
                });
	const search_data = await search_response.json();
	console.log("---------------")
	console.log(search_data)
	console.log("---------------")

	for (let game in search_data.channels) {
		let game_name = search_data.channels[game].name
		let props = search_data.channels[game].props
		let dev_id = search_data.channels[game].owner.id
		let game_id = search_data.channels[game].id

		const placetoadd = document.getElementById("body");
		const gamediv = document.createElement("div");
		gamediv.id = "gamediv" + game_name;
		gamediv.className = "gamediv";
		gamediv.textContent = game_name + "  ";
		placetoadd.appendChild(gamediv);
		
		const button = document.createElement("button");
		button.id = String(game_id);
		button.className = "buttons";
		button.innerText = "Open";
		button.addEventListener("click",open_url)
		gamediv.appendChild(button);
		
	}
	
	if (localStorage) {
			if (localStorage.getItem("storeAccount") == null) {
				console.log("no login data")
			} else {
			console.log(localStorage.getItem("storeAccount"))
			var data = JSON.parse(localStorage.getItem("storeAccount"))
			var alias_id = data.alias
			var player_id = data.player
			var session_token = data.token
			var refresh_token = data.refresh 
			
			const refresh_response = await fetch('https://api.trytalo.com/v1/players/auth/refresh', {
        	method: 'POST',
            headers: {
            		Authorization: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjIyNjgsImFwaSI6dHJ1ZSwiaWF0IjoxNzg5ODI0ODQ3fQ.xlfl7aFmnSWzcz7joyVnQzBjkFTA9yDpj8Ra_xCWpZI",
                	'Content-Type': 'application/json',
					'X-Talo-Player': player_id,
					'X-Talo-Alias': alias_id,
					'X-Talo-Session': session_token,
					
                 },
                  body: JSON.stringify({"refreshToken": refresh_token}),
                });
			console.log(refresh_response)
			const refresh_data = await refresh_response.json();
			refresh_token = refresh_data.refreshToken
			session_token = refresh_data.sessionToken
			localStorage.setItem("storeAccount",JSON.stringify({"token":session_token,"refresh":refresh_token,"alias":alias_id,"player":player_id}))
            const check_response = await fetch('https://api.trytalo.com/v1/players/' + player_id, {
        	method: 'GET',
            headers: {
            		Authorization: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjIyNjgsImFwaSI6dHJ1ZSwiaWF0IjoxNzg5ODI0ODQ3fQ.xlfl7aFmnSWzcz7joyVnQzBjkFTA9yDpj8Ra_xCWpZI",
                	'Content-Type': 'application/json',
					'X-Talo-Player': player_id,
					'X-Talo-Alias': alias_id,
					'X-Talo-Session': session_token,
					
                 },
                  
                });
			const check_data = await check_response.json();
			if (check_data.hasOwnProperty("player")){
				let player_name = check_data.player.aliases.at(0).displayName
				document.getElementById('account_text').innerText = "Logged in as: " + player_name
				document.getElementById("logout").style.display = "block";
				
	} else {
			console.log("Your account will not persist")
	}
	}
	}

	function open_url(data) {
		window.location = "gamepage?id=" + data.srcElement.id
	}
</script>
